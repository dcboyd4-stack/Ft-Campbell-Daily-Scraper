name: Land cover by training area

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["landcover.py", "gis/zones.png", "gis/zones.json", ".github/workflows/landcover.yml"]

permissions:
  contents: write

jobs:
  landcover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install rasterio==1.4.3 pyproj==3.7.0 numpy pillow requests

      - name: Build land cover
        run: python landcover.py 2>&1 | tee gis/run.log

      - name: Commit results
        if: always()
        run: |
          git config user.name "pressure-bot"
          git config user.email "pressure-bot@users.noreply.github.com"
          git add gis/
          git diff --cached --quiet || git commit -m "Land cover by training area"
          git pull --rebase -q origin main && git push
